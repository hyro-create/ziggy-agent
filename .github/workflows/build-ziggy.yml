
name: Compiler Ziggy pour Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        shell: pwsh
        working-directory: ziggy
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements-build.txt") {
            python -m pip install -r requirements-build.txt
          } elseif (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Vérifier les fichiers
        shell: pwsh
        working-directory: ziggy
        run: |
          if (!(Test-Path "ziggy.spec") -and !(Test-Path "ziggy.py")) {
            Write-Error "ziggy.spec et ziggy.py sont introuvables dans le dossier ziggy."
            exit 1
          }

      - name: Compiler Ziggy
        shell: pwsh
        working-directory: ziggy
        run: |
          if (Test-Path "ziggy.spec") {
            python -m PyInstaller --noconfirm ziggy.spec
          } elseif (Test-Path "ziggy.py") {
            python -m PyInstaller --noconfirm --onedir --name Ziggy ziggy.py
          }

      - name: Publier le résultat
        uses: actions/upload-artifact@v4
        with:
          name: Ziggy-Windows
          path: ziggy/dist/
          if-no-files-found: error
          retention-days: 7
